<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1200" />
        <title>OG card — mnightingale.dev (screenshot the 1200x630 card)</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #000;
                font-family: "Nunito", system-ui, sans-serif;
            }
            .og-stage {
                position: relative;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 48px;
                background-color: #f8f8f8;
                color: #1a1a1a;
                isolation: isolate;
            }
            .og-stage canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
            }
            .og-mascot,
            .og-copy {
                position: relative;
                z-index: 1;
            }
            .og-mascot {
                width: 200px;
                height: 200px;
                flex-shrink: 0;
            }
            .og-name {
                margin: 0;
                font-family: "Titan One", sans-serif;
                font-weight: 400;
                font-size: 64px;
                line-height: 1;
                letter-spacing: -0.01em;
            }
            .og-sub {
                margin: 16px 0 0;
                font-size: 22px;
                font-weight: 600;
                color: #6b7280;
                max-width: 560px;
            }
            .og-domain {
                margin: 20px 0 0;
                display: inline-block;
                font-family: monospace;
                font-size: 18px;
                color: #1a1a1a;
                border: 2px solid #e5e7eb;
                background: #ffffff;
                border-radius: 999px;
                padding: 10px 28px;
            }
        </style>
    </head>
    <body>
        <!-- Screenshot just the 1200x630 card, save as assets/images/og-image.png, then wire up og:image + twitter:image. -->
        <div class="og-stage">
            <canvas id="og-ascii" aria-hidden="true"></canvas>
            <img class="og-mascot" src="./assets/images/favicon.png" alt="" width="200" height="200" />
            <div class="og-copy">
                <p class="og-name">
                    Marcus
                    <br />
                    Nightingale
                </p>
                <p class="og-sub">Senior PHP developer · ISO 27001 Lead Implementor · Game dev</p>
            </div>
        </div>
        <script>
            const canvas = document.getElementById("og-ascii");
            const ctx = canvas.getContext("2d");
            const glyphs = "  ..::--==++**##@@";
            const W = 1200;
            const H = 630;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            let last = 0;
            function smoothstep(e0, e1, v) {
                const t = Math.min(Math.max((v - e0) / (e1 - e0), 0), 1);
                return t * t * (3 - 2 * t);
            }
            function draw(time) {
                ctx.clearRect(0, 0, W, H);
                const cell = 17;
                ctx.font = `${cell * 0.82}px ui-monospace, Menlo, Consolas, monospace`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                for (let y = cell * 0.5; y < H; y += cell) {
                    for (let x = cell * 0.5; x < W; x += cell) {
                        const nx = x / W;
                        const ny = y / H;
                        const bend = Math.sin(nx * 7.2 - time * 0.42) * 0.12;
                        const broadWave = Math.sin((ny + bend) * 17 - time * 0.9 + 1.6);
                        const crossWave = Math.cos(nx * 10.5 + ny * 4.5 + time * 0.38 - 0.56);
                        const texture = Math.sin(nx * 27 - ny * 19 + time * 0.22 + 0.32) * 0.16;
                        const value = broadWave * 0.58 + crossWave * 0.28 + texture;
                        const normalized = Math.min(Math.max((value + 1.05) / 2.1, 0), 1);
                        const glyph = glyphs[Math.min(Math.floor(normalized * glyphs.length), glyphs.length - 1)];
                        if (glyph === " ") continue;
                        const edgeFade = Math.min(x / 130, (W - x) / 130, 1);
                        const placement = 0.08 + smoothstep(0.56, 0.94, nx) * 0.92;
                        const blueSplash = Math.max(0, Math.sin(nx * 8.5 - time * 0.34 + ny * 2.2) * 0.5 + Math.sin(ny * 11 + time * 0.25) * 0.3 - 0.12);
                        const mix = Math.min(blueSplash * 3.2, 1);
                        ctx.fillStyle = `rgba(${Math.round(91 - mix * 54)}, ${Math.round(101 + mix * 75)}, ${Math.round(111 + mix * 136)}, ${edgeFade * placement * (0.11 + normalized * 0.34)})`;
                        ctx.fillText(glyph, x, y);
                    }
                }
            }
            function frame(now) {
                if (now - last >= 30) {
                    draw(now * 0.001);
                    last = now;
                }
                requestAnimationFrame(frame);
            }
            draw(0);
            requestAnimationFrame(frame);
        </script>
    </body>
</html>
